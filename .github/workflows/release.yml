name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      releases: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Package source
        run: |
          cd "${{ github.workspace }}"
          archive_name="${{ github.event.repository.name }}-${{ github.ref_name }}"
          tar --exclude='.git' --exclude='.gitignore' \
              --exclude="${archive_name}.tar.gz" \
              -czf "${archive_name}.tar.gz" .
          ls -lh "${archive_name}.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz"
